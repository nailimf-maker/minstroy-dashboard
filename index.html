<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Минстрой МО — Дашборд переселения | Zaha Hadid style</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;900&family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    transition: background 0.2s ease, color 0.2s, border-color 0.2s;
  }

  body {
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at 20% 30%, #0a0c10 0%, #020304 100%);
    color: #eef5ff;
    overflow-x: hidden;
    transition: all 0.3s;
  }

  body.light {
    background: radial-gradient(circle at 20% 30%, #f5f7fc 0%, #e9ecef 100%);
    color: #1a1e2a;
  }

  /* Жидкие органические линии */
  body::before {
    content: "";
    position: fixed;
    top: -20%;
    left: -10%;
    width: 120%;
    height: 140%;
    background: repeating-linear-gradient(45deg, rgba(0,240,255,0.02) 0px, rgba(0,240,255,0.02) 2px, rgba(255,0,204,0.01) 2px, rgba(255,0,204,0.01) 8px);
    pointer-events: none;
    z-index: 0;
  }

  .glass-card {
    background: rgba(12, 20, 30, 0.65);
    backdrop-filter: blur(10px);
    border-radius: 48px 16px 48px 16px;
    border: 1px solid rgba(0,240,255,0.3);
    transition: 0.25s;
  }

  body.light .glass-card {
    background: rgba(245, 247, 252, 0.85);
    border-color: rgba(0,240,255,0.5);
    color: #1a1e2a;
  }

  .hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    padding: 14px 32px;
    background: rgba(2, 6, 16, 0.8);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(0,240,255,0.4);
    border-radius: 0 0 48px 48px;
    position: relative;
    z-index: 20;
  }

  body.light .hdr {
    background: rgba(240, 244, 250, 0.9);
    border-bottom-color: #00f0ff;
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .hdr-icon {
    background: linear-gradient(135deg, #00f0ff, #ff00cc);
    border-radius: 30px 8px 30px 8px;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    box-shadow: 0 0 10px #00f0ff;
  }

  .hdr-t1 {
    font-family: 'Orbitron', monospace;
    font-weight: 800;
    font-size: 1rem;
    background: linear-gradient(135deg, #fff, #00f0ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hdr-t2 {
    font-size: 0.7rem;
    color: #aac8ff;
  }

  body.light .hdr-t2 {
    color: #2c3e66;
  }

  .msk-block {
    text-align: right;
    font-family: 'Orbitron', monospace;
  }

  #msk-time {
    font-size: 1.2rem;
    font-weight: 700;
    color: #00f0ff;
  }

  #msk-date {
    font-size: 0.7rem;
  }

  .theme-toggle {
    background: #1e2a3a;
    border: none;
    border-radius: 40px;
    padding: 6px 14px;
    color: #00f0ff;
    font-weight: bold;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
  }

  .page-tabs {
    display: flex;
    gap: 12px;
    margin: 0 20px;
  }

  .ptab {
    background: transparent;
    border: 1px solid rgba(0,240,255,0.5);
    padding: 8px 24px;
    border-radius: 40px;
    font-weight: bold;
    cursor: pointer;
    backdrop-filter: blur(4px);
    color: #ccf4ff;
  }

  .ptab.active, .ptab:hover {
    background: linear-gradient(95deg, #00f0ff20, #ff00cc20);
    border-color: #ff00cc;
    box-shadow: 0 0 12px #ff00cc80;
    color: white;
  }

  .fbar {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin: 20px 32px;
    padding: 12px 24px;
    background: rgba(10, 14, 23, 0.7);
    backdrop-filter: blur(12px);
    border-radius: 60px;
    border: 1px solid rgba(0,240,255,0.4);
  }

  .fbar-select {
    background: #11161f;
    border: 1px solid #2a3b55;
    border-radius: 40px;
    padding: 8px 20px;
    color: white;
    font-family: 'Poppins', sans-serif;
    font-weight: 500;
    cursor: pointer;
    outline: none;
  }

  body.light .fbar-select {
    background: white;
    color: #111;
    border-color: #00f0ff;
  }

  .btn-rst {
    background: #1e1a2f;
    border: 1px solid #ff00cc;
    border-radius: 40px;
    padding: 8px 20px;
    color: white;
    cursor: pointer;
  }

  .content {
    padding: 20px 32px;
    position: relative;
    z-index: 2;
  }

  .kpi-hero {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 20px;
    margin-bottom: 32px;
  }

  .kpi-card {
    background: rgba(12, 20, 30, 0.6);
    backdrop-filter: blur(8px);
    border-radius: 32px 12px 32px 12px;
    padding: 20px;
    cursor: pointer;
    transition: 0.2s;
    border-bottom: 3px solid #00f0ff;
  }

  .kpi-card:hover {
    transform: translateY(-8px);
    background: rgba(0,240,255,0.1);
    box-shadow: 0 20px 30px -12px #00f0ff80;
  }

  .kh-val {
    font-size: 2.8rem;
    font-weight: 900;
    background: linear-gradient(135deg, #fff, #00f0ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .dec-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
    margin: 20px 0;
  }

  .dec-card {
    background: linear-gradient(145deg, #0f1622, #05080e);
    border-radius: 48px 16px 48px 16px;
    padding: 20px;
    cursor: pointer;
    border: 1px solid rgba(0,240,255,0.3);
  }

  .dec-card.active-dec {
    border: 2px solid #ff00cc;
    box-shadow: 0 0 20px #ff00cc;
  }

  .chart-card, .registry-card {
    background: rgba(8, 12, 22, 0.65);
    backdrop-filter: blur(12px);
    border-radius: 32px;
    padding: 20px;
    margin-bottom: 24px;
    border: 1px solid rgba(0,240,255,0.2);
  }

  /* Модальное окно */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal-window {
    background: #0f1722;
    border-radius: 48px 16px 48px 16px;
    width: 90%;
    max-width: 600px;
    max-height: 80vh;
    overflow: auto;
    padding: 20px;
    border: 1px solid #00f0ff;
  }

  body.light .modal-window {
    background: #f0f4fa;
    color: #111;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #00f0ff;
    padding-bottom: 10px;
    margin-bottom: 16px;
  }

  .modal-close {
    background: none;
    border: none;
    font-size: 28px;
    cursor: pointer;
    color: #ff00cc;
  }

  .modal-list {
    max-height: 60vh;
    overflow-y: auto;
  }

  .modal-item {
    display: grid;
    grid-template-columns: 40px 1fr 100px 80px;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(0,240,255,0.2);
  }

  /* Карта */
  #map {
    height: 460px;
    border-radius: 32px;
    overflow: hidden;
    border: 1px solid #00f0ff;
    margin-top: 20px;
  }

  button, select {
    font-family: 'Poppins', sans-serif;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    color: inherit;
  }

  th, td {
    padding: 8px;
    text-align: left;
    border-bottom: 1px solid rgba(0,240,255,0.2);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .page {
    display: none;
    animation: fadeIn 0.3s;
  }

  .page.active {
    display: block;
  }

  .loading {
    position: fixed;
    inset: 0;
    background: #000000cc;
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
  }
</style>
</head>
<body>

<div class="hdr">
  <div class="logo-area">
    <div class="hdr-icon">🏛️</div>
    <div>
      <div class="hdr-t1">МИНСТРОЙ МО · ПЕРЕСЕЛЕНИЕ</div>
      <div class="hdr-t2">Программа сертификатов — аналитика</div>
    </div>
  </div>
  <div class="page-tabs">
    <button class="ptab active" data-page="overview">📊 Обзор</button>
    <button class="ptab" data-page="finance">💰 Финансы</button>
    <button class="ptab" data-page="map">🗺️ Карта</button>
  </div>
  <div class="msk-block">
    <div id="msk-time">--:--:--</div>
    <div id="msk-date">--</div>
  </div>
  <button class="theme-toggle" id="themeToggle">🌓 День/Ночь</button>
</div>

<div class="fbar">
  <select id="f-round" class="fbar-select"><option value="">Все округа</option></select>
  <select id="f-dec" class="fbar-select"><option value="">Все решения</option></select>
  <select id="f-type" class="fbar-select"><option value="">Все типы</option></select>
  <button class="btn-rst" id="resetFilters">↺ Сброс</button>
  <span id="fcnt" style="color:#0ff;"></span>
</div>

<div class="loading" id="loading" style="display:flex;">Загрузка данных...</div>

<!-- Страница Обзор -->
<div class="page active" id="page-overview">
<div class="content">
  <div class="kpi-hero" id="kpiContainer"></div>
  <div style="font-weight: bold; margin-top:20px;">Решения</div>
  <div class="dec-row" id="decisionsContainer"></div>
  <div class="charts-row" style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
    <div class="chart-card"><canvas id="c-dec" height="200"></canvas></div>
    <div class="chart-card"><canvas id="c-own" height="200"></canvas></div>
  </div>
  <div class="registry-card"><div class="twrap"><table id="tbl-registry" width="100%"></tr></div></div>
</div>
</div>

<!-- Страница Финансы -->
<div class="page" id="page-finance">
<div class="content">
  <div id="finKpiRow" class="kpi-hero" style="margin-bottom:20px;"></div>
  <div class="chart-card"><canvas id="c-fin-compare" height="300"></canvas></div>
  <div class="registry-card"><table id="tbl-fin"></table></div>
</div>
</div>

<!-- Страница Карта -->
<div class="page" id="page-map">
<div class="content">
  <div id="map"></div>
</div>
</div>

<!-- Модальное окно -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal-window">
    <div class="modal-header">
      <span id="modalTitle"></span>
      <button class="modal-close" id="closeModalBtn">&times;</button>
    </div>
    <div id="modalList" class="modal-list"></div>
  </div>
</div>

<script>
// Google Sheets конфиг (полный список)
const PUB = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSzyHOAkQRwBuyLTWw0xyAkA3aQWjHNAT1wSRMmmB7zjYARDMG470ErejHEFid200TUUbGvbQNYUPsE/pub?output=csv';
const SHEETS = [
  {name:'Балашиха',gid:'1795562364'},{name:'Богородский',gid:'0'},{name:'Бронницы',gid:'1103582215'},
  {name:'Волоколамский',gid:'220979544'},{name:'Дмитровский',gid:'1892432856'},{name:'Воскресенск',gid:'1653606013'},
  {name:'Домодедово',gid:'1870428576'},{name:'Дубна',gid:'1718290784'},{name:'Егорьевск',gid:'1549030074'},
  {name:'Жуковский',gid:'305796329'},{name:'Зарайск',gid:'283920738'},{name:'Истра',gid:'1434615352'},
  {name:'Кашира',gid:'1580393335'},{name:'Клин',gid:'1338049965'},{name:'Коломна',gid:'106788836'},
  {name:'Королев',gid:'1576913234'},{name:'Котельники',gid:'1390969273'},{name:'Красногорск',gid:'1821499361'},
  {name:'Лобня',gid:'2065587021'},{name:'Лосино-Петровский',gid:'2082287183'},{name:'Луховицы',gid:'239748466'},
  {name:'Люберцы',gid:'1843254790'},{name:'Можайский',gid:'661476574'},{name:'Мытищи',gid:'846842811'},
  {name:'Наро-Фоминский',gid:'249806909'},{name:'Одинцовский',gid:'1539692434'},{name:'Орехово-Зуево',gid:'696528998'},
  {name:'Павлово-Посадский',gid:'1190501242'},{name:'Подольск',gid:'1062490300'},{name:'Пушкинский',gid:'1496220984'},
  {name:'Раменский',gid:'732430860'},{name:'Рузский',gid:'376297159'},{name:'Сергиево-Посадский',gid:'782139300'},
  {name:'Серебряные Пруды',gid:'344890850'},{name:'Серпухов',gid:'1919190345'},{name:'Солнечногорск',gid:'24184888'},
  {name:'Ступино',gid:'1528804810'},{name:'Талдомский',gid:'652495233'},{name:'Химки',gid:'1817325599'},
  {name:'Чехов',gid:'1699541847'},{name:'Шатура',gid:'1588732400'},{name:'Шаховская',gid:'1886732760'},
  {name:'Щелково',gid:'2101160216'},{name:'Электросталь',gid:'1617637044'}
];

// Колонки (индексы из вашей таблицы)
const C = { mo:3, np:4, addr:5, apt:6, area:7, citizens:8, owner:11, certType:12, dateApp:13,
  decision:14, signed:15, buyConsent:17, price:20, dkp:21, newDistrict:22, newAddr:23, newArea:24,
  builder:25, contractType:26, contractPrice:27, minPay:28, lat:29, lon:30 };

let allData = [], filteredData = [];
let charts = { dec: null, own: null, fin: null };
let mapObj, mapInitialized = false;
let currentModalCallback = null;

// Вспомогательные функции
function normDecision(v) {
  let s = String(v||'').toLowerCase();
  if(s.includes('положительн')) return 'Положительное';
  if(s.includes('отриц')) return 'Отрицательное';
  if(s.includes('рассм') || s.includes('приостановк')) return 'На рассмотрении';
  if(s.includes('отказ')) return 'Отказ';
  return 'Не указано';
}
function normOwner(v) {
  let s = String(v||'').toLowerCase();
  if(s.includes('собственник')) return 'Собственник';
  if(s.includes('наниматель')) return 'Наниматель';
  return 'Не указано';
}
function normType(v) {
  let s = String(v||'').toLowerCase();
  if(s.includes('сертификат')) return 'Сертификат';
  if(s.includes('выкуп')) return 'Выкуп';
  return 'Другое';
}
function n(x) {
  let num = parseFloat(String(x).replace(/\s/g,'').replace(',','.'));
  return isNaN(num) ? 0 : num;
}
function fmtMln(v) {
  if(v === 0) return '0';
  if(v >= 1e9) return (v/1e9).toFixed(2) + ' млрд';
  if(v >= 1e6) return (v/1e6).toFixed(1) + ' млн';
  return v.toLocaleString('ru') + ' ₽';
}
function formatNumber(x) { return x.toLocaleString('ru'); }

// Загрузка данных
async function loadData() {
  allData = [];
  for(let sh of SHEETS) {
    await new Promise(resolve => {
      Papa.parse(PUB+'&gid='+sh.gid+'&cachebust='+Date.now(), { download:true, header:false, skipEmptyLines:true,
        complete: (res) => {
          if(res.data && res.data.length) {
            res.data.slice(1).forEach(row => {
              if(row[0] && /^\d+$/.test(row[0])) {
                row._sheet = sh.name;
                allData.push(row);
              }
            });
          }
          resolve();
        }
      });
    });
  }
  filteredData = [...allData];
  document.getElementById('loading').style.display = 'none';
  renderAll();
  initFilters();
}

function initFilters() {
  let rounds = [...new Set(allData.map(r=>r._sheet))].sort();
  let decisions = [...new Set(allData.map(r=>normDecision(r[C.decision])))].sort();
  let types = [...new Set(allData.map(r=>normType(r[C.certType])))].sort();
  let roundSel = document.getElementById('f-round');
  roundSel.innerHTML = '<option value="">Все округа</option>' + rounds.map(r=>`<option>${r}</option>`).join('');
  let decSel = document.getElementById('f-dec');
  decSel.innerHTML = '<option value="">Все решения</option>' + decisions.map(d=>`<option>${d}</option>`).join('');
  let typeSel = document.getElementById('f-type');
  typeSel.innerHTML = '<option value="">Все типы</option>' + types.map(t=>`<option>${t}</option>`).join('');
}

function applyFilters() {
  let round = document.getElementById('f-round').value;
  let dec = document.getElementById('f-dec').value;
  let type = document.getElementById('f-type').value;
  filteredData = allData.filter(r => 
    (!round || r._sheet === round) &&
    (!dec || normDecision(r[C.decision]) === dec) &&
    (!type || normType(r[C.certType]) === type)
  );
  document.getElementById('fcnt').innerText = filteredData.length ? `▶ ${filteredData.length} строк` : '';
  renderAll();
}

function resetFilters() {
  document.getElementById('f-round').value = '';
  document.getElementById('f-dec').value = '';
  document.getElementById('f-type').value = '';
  applyFilters();
}

// Рендер всего
function renderAll() {
  renderKPIs();
  renderDecisions();
  renderCharts();
  renderRegistry();
  renderFinance();
  if(document.getElementById('page-map').classList.contains('active')) renderMap();
}

function renderKPIs() {
  let total = filteredData.length;
  let area = filteredData.reduce((s,r)=>s+n(r[C.area]),0);
  let sob = filteredData.filter(r=>normOwner(r[C.owner])==='Собственник').length;
  let nan = filteredData.filter(r=>normOwner(r[C.owner])==='Наниматель').length;
  let cert = filteredData.filter(r=>normType(r[C.certType])==='Сертификат').length;
  let vyk = filteredData.filter(r=>normType(r[C.certType])==='Выкуп').length;
  const kpiData = { total, sob, nan, cert, vyk };
  const kpiLabels = { total:'Всего квартир', sob:'Собственники', nan:'Наниматели', cert:'Сертификаты', vyk:'Выкуп' };
  const container = document.getElementById('kpiContainer');
  container.innerHTML = Object.keys(kpiData).map(key => `
    <div class="kpi-card" data-kpi="${key}">
      <div class="kh-lbl">${kpiLabels[key]}</div>
      <div class="kh-val">${formatNumber(kpiData[key])}</div>
      <div class="kh-sub">площадь: ${area.toFixed(0)} м²</div>
    </div>
  `).join('');
  document.querySelectorAll('.kpi-card').forEach(card => {
    card.addEventListener('click', () => {
      const kpi = card.dataset.kpi;
      let aggr = {};
      filteredData.forEach(r => {
        let round = r._sheet || '—';
        let val = 0;
        if(kpi === 'total') val = 1;
        else if(kpi === 'sob') val = normOwner(r[C.owner]) === 'Собственник' ? 1 : 0;
        else if(kpi === 'nan') val = normOwner(r[C.owner]) === 'Наниматель' ? 1 : 0;
        else if(kpi === 'cert') val = normType(r[C.certType]) === 'Сертификат' ? 1 : 0;
        else if(kpi === 'vyk') val = normType(r[C.certType]) === 'Выкуп' ? 1 : 0;
        if(val) aggr[round] = (aggr[round] || 0) + val;
      });
      let sorted = Object.entries(aggr).sort((a,b)=>b[1]-a[1]);
      let totalSum = sorted.reduce((s,e)=>s+e[1],0);
      let html = sorted.map(([name,val],idx) => `
        <div class="modal-item">
          <span>${idx+1}</span><span>${name}</span><span>${val}</span><span>${totalSum?Math.round(val/totalSum*100):0}%</span>
        </div>
      `).join('');
      document.getElementById('modalTitle').innerText = `${kpiLabels[kpi]} — по округам`;
      document.getElementById('modalList').innerHTML = html;
      document.getElementById('modalOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    });
  });
}

function renderDecisions() {
  let counts = { Положительное:0, 'На рассмотрении':0, Отрицательное:0, Отказ:0, 'Не указано':0 };
  filteredData.forEach(r => counts[normDecision(r[C.decision])]++);
  const decOrder = ['Положительное','На рассмотрении','Отрицательное','Отказ','Не указано'];
  const colors = { 'Положительное':'linear-gradient(135deg,#1a7a40,#27ae60)','На рассмотрении':'linear-gradient(135deg,#b7770d,#f39c12)','Отрицательное':'linear-gradient(135deg,#922b21,#e74c3c)','Отказ':'linear-gradient(135deg,#6c3483,#9b59b6)','Не указано':'linear-gradient(135deg,#154360,#2980b9)' };
  const container = document.getElementById('decisionsContainer');
  container.innerHTML = decOrder.map(dec => `
    <div class="dec-card" data-decision="${dec}" style="background:${colors[dec]}">
      <div class="dc-label">${dec}</div>
      <div class="dc-val">${counts[dec]}</div>
      <div class="dc-sub">${filteredData.length?Math.round(counts[dec]/filteredData.length*100):0}%</div>
    </div>
  `).join('');
  document.querySelectorAll('.dec-card').forEach(card => {
    card.addEventListener('click', () => {
      const dec = card.dataset.decision;
      let aggr = {};
      filteredData.forEach(r => {
        if(normDecision(r[C.decision]) === dec) {
          let round = r._sheet || '—';
          aggr[round] = (aggr[round] || 0) + 1;
        }
      });
      let sorted = Object.entries(aggr).sort((a,b)=>b[1]-a[1]);
      let total = sorted.reduce((s,e)=>s+e[1],0);
      let html = sorted.map(([name,val],idx) => `
        <div class="modal-item">
          <span>${idx+1}</span><span>${name}</span><span>${val}</span><span>${total?Math.round(val/total*100):0}%</span>
        </div>
      `).join('');
      document.getElementById('modalTitle').innerText = `${dec} — по округам`;
      document.getElementById('modalList').innerHTML = html;
      document.getElementById('modalOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    });
  });
}

function renderCharts() {
  let decCount = { Положительное:0, 'На рассмотрении':0, Отрицательное:0, Отказ:0, 'Не указано':0 };
  filteredData.forEach(r => decCount[normDecision(r[C.decision])]++);
  let ctxDec = document.getElementById('c-dec').getContext('2d');
  if(charts.dec) charts.dec.destroy();
  charts.dec = new Chart(ctxDec, {
    type: 'bar',
    data: { labels: Object.keys(decCount), datasets: [{ data: Object.values(decCount), backgroundColor: '#00f0ff80', borderRadius: 12 }] },
    options: { responsive: true, maintainAspectRatio: true }
  });
  let ownCount = { Собственник:0, Наниматель:0 };
  filteredData.forEach(r => ownCount[normOwner(r[C.owner])]++);
  let ctxOwn = document.getElementById('c-own').getContext('2d');
  if(charts.own) charts.own.destroy();
  charts.own = new Chart(ctxOwn, {
    type: 'doughnut',
    data: { labels: Object.keys(ownCount), datasets: [{ data: Object.values(ownCount), backgroundColor: ['#ff00cc','#00f0ff'] }] }
  });
}

function renderRegistry() {
  let html = '<thead><tr><th>№</th><th>Округ</th><th>Адрес</th><th>Площадь</th><th>Решение</th><th>Стоимость</th></tr></thead><tbody>';
  filteredData.slice(0, 100).forEach((r,i) => {
    html += `<tr>
      <td>${i+1}</td>
      <td>${r._sheet}</td>
      <td>${r[C.addr]||''}</td>
      <td>${n(r[C.area]).toFixed(1)}</td>
      <td>${normDecision(r[C.decision])}</td>
      <td>${fmtMln(n(r[C.price]))}</td>
    </tr>`;
  });
  html += '</tbody>';
  document.getElementById('tbl-registry').innerHTML = html;
}

function renderFinance() {
  let totalEval = 0, totalContract = 0, paidCnt = 0;
  filteredData.forEach(r => {
    totalEval += n(r[C.price]);
    totalContract += n(r[C.contractPrice]);
    if(lo(r[C.minPay]) === 'да') paidCnt++;
  });
  document.getElementById('finKpiRow').innerHTML = `
    <div class="kpi-card"><div class="kh-lbl">Стоимость по оценке</div><div class="kh-val">${fmtMln(totalEval)}</div></div>
    <div class="kpi-card"><div class="kh-lbl">Цена договора</div><div class="kh-val">${fmtMln(totalContract)}</div></div>
    <div class="kpi-card"><div class="kh-lbl">Оплачено Мин-вом</div><div class="kh-val">${paidCnt}</div></div>
    <div class="kpi-card"><div class="kh-lbl">Разница</div><div class="kh-val">${fmtMln(Math.abs(totalEval-totalContract))}</div></div>
  `;
  // график сравнения
  let rounds = {};
  filteredData.forEach(r => {
    let round = r._sheet;
    if(!rounds[round]) rounds[round] = { eval:0, contract:0 };
    rounds[round].eval += n(r[C.price]);
    rounds[round].contract += n(r[C.contractPrice]);
  });
  let top = Object.entries(rounds).sort((a,b)=>b[1].eval - a[1].eval).slice(0,10);
  let ctx = document.getElementById('c-fin-compare').getContext('2d');
  if(charts.fin) charts.fin.destroy();
  charts.fin = new Chart(ctx, {
    type: 'bar',
    data: { labels: top.map(t=>t[0]), datasets: [
      { label: 'Оценка, млн ₽', data: top.map(t=>t[1].eval/1e6), backgroundColor: '#00f0ff' },
      { label: 'Договор, млн ₽', data: top.map(t=>t[1].contract/1e6), backgroundColor: '#ff00cc' }
    ]}
  });
  // таблица финансов
  let finHtml = '<thead><tr><th>Округ</th><th>Адрес</th><th>Оценка</th><th>Договор</th></tr></thead><tbody>';
  filteredData.slice(0,50).forEach(r => {
    finHtml += `<tr>
      <td>${r._sheet}</td>
      <td>${r[C.addr]||''}</td>
      <td>${fmtMln(n(r[C.price]))}</td>
      <td>${fmtMln(n(r[C.contractPrice]))}</td>
    </tr>`;
  });
  finHtml += '</tbody>';
  document.getElementById('tbl-fin').innerHTML = finHtml;
}

function lo(s) { return String(s||'').toLowerCase(); }

// Карта
function renderMap() {
  if(!mapInitialized) {
    mapInitialized = true;
    mapObj = L.map('map').setView([55.75, 37.62], 10);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '© CartoDB' }).addTo(mapObj);
  } else {
    mapObj.eachLayer(layer => { if(layer instanceof L.Marker || layer instanceof L.Polyline) mapObj.removeLayer(layer); });
  }
  // данные для маршрутов: из таблицы Балашиха, но можно расширить
  let moves = [];
  let balData = allData.filter(r => r._sheet === 'Балашиха' && n(r[C.lat]) && n(r[C.lon]));
  balData.forEach(r => {
    let fromLat = n(r[C.lat]), fromLon = n(r[C.lon]);
    let toLat = n(r[C.lat]) + 0.003;  // если нет отдельных координат нового жилья, смещаем
    let toLon = n(r[C.lon]) + 0.004;
    if(fromLat && fromLon) {
      moves.push({ from: { lat:fromLat, lng:fromLon, addr: r[C.addr] }, to: { lat:toLat, lng:toLon, addr: r[C.newAddr] || 'Новое жильё' } });
    }
  });
  moves.forEach(m => {
    let redIcon = L.divIcon({ html: '<div style="width:16px;height:16px;background:#e74c3c;border-radius:50%;border:2px solid white;"></div>', iconSize:[16,16] });
    let greenIcon = L.divIcon({ html: '<div style="width:16px;height:16px;background:#27ae60;border-radius:50%;border:2px solid white;"></div>', iconSize:[16,16] });
    L.marker([m.from.lat, m.from.lng], { icon: redIcon }).bindPopup(m.from.addr).addTo(mapObj);
    L.marker([m.to.lat, m.to.lng], { icon: greenIcon }).bindPopup(m.to.addr).addTo(mapObj);
    L.polyline([[m.from.lat,m.from.lng],[m.to.lat,m.to.lng]], { color: '#ff00cc', weight: 2, dashArray: '5 5' }).addTo(mapObj);
  });
}

// Переключение вкладок
document.querySelectorAll('.ptab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.ptab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    let page = btn.dataset.page;
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(`page-${page}`).classList.add('active');
    if(page === 'map') renderMap();
    if(page === 'finance') renderFinance();
  });
});

document.getElementById('resetFilters').addEventListener('click', resetFilters);
document.getElementById('f-round').addEventListener('change', applyFilters);
document.getElementById('f-dec').addEventListener('change', applyFilters);
document.getElementById('f-type').addEventListener('change', applyFilters);

// Московское время
function updateMsk() {
  let now = new Date();
  let msk = new Date(now.getTime() + now.getTimezoneOffset()*60000 + 3*3600000);
  let time = msk.toLocaleTimeString('ru', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  let date = msk.toLocaleDateString('ru', { day:'numeric', month:'long', year:'numeric', weekday:'long' });
  document.getElementById('msk-time').innerText = `МСК ${time}`;
  document.getElementById('msk-date').innerText = date;
}
setInterval(updateMsk, 1000);
updateMsk();

// Тёмная/светлая тема
const themeToggle = document.getElementById('themeToggle');
if(localStorage.getItem('theme') === 'light') document.body.classList.add('light');
themeToggle.addEventListener('click', () => {
  document.body.classList.toggle('light');
  localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
});

// Модальное окно закрытие
document.getElementById('closeModalBtn').addEventListener('click', () => {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
});
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if(e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }
});

loadData();
